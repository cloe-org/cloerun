[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cloerun"
version = "0.1.0"
description = "Run Euclid inference campaigns (synthetic data, chains, analysis) with cloelike likelihoods"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyyaml",
    "numpy",
    "scipy",
    "nautilus-sampler",
]

[project.scripts]
cloerun = "cloerun.__main__:main"

[project.optional-dependencies]
test = ["pytest"]
analyse = ["getdist", "matplotlib"]
# The cloe-org releases cloerun is tested with.
cloe = [
    "cloelib @ git+https://github.com/cloe-org/cloelib.git@v0.11",
    "cloelike @ git+https://github.com/cloe-org/cloelike.git@v0.3",
]

[tool.hatch.metadata]
# For the git releases of the `cloe` extra.
allow-direct-references = true

[tool.pytest.ini_options]
addopts = "--verbose"
testpaths = ["tests"]
